name: Build

# Builds the mod whenever code changes (or manually). The game's reference DLLs are NOT in the
# repo; they are fetched from the "game-libs" release (see docs/GAME-FILES-NEEDED.md). Until
# they are uploaded, the workflow reports a "waiting for game libs" state instead of failing.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSBuild (VS)
        uses: microsoft/setup-msbuild@v2

      - name: Locate game libraries
        id: libs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $managed = @(
            "Assembly-CSharp.dll",
            "Assembly-CSharp-firstpass.dll",
            "Newtonsoft.Json.dll",
            "Owlcat.Runtime.Core.dll",
            "Owlcat.Runtime.UI.dll",
            "Owlcat.Runtime.Validation.dll",
            "Owlcat.Runtime.Visual.dll",
            "UnityEngine.dll",
            "UnityEngine.CoreModule.dll"
          )
          $umm = @("UnityModManager.dll", "0Harmony.dll")

          function Test-AllLibs {
            foreach ($f in $managed) { if (-not (Test-Path "Libs/$f")) { return $false } }
            foreach ($f in $umm) { if (-not (Test-Path "Libs/UMM/$f")) { return $false } }
            return $true
          }

          if (-not (Test-AllLibs)) {
            New-Item -ItemType Directory -Force -Path _gamelibs | Out-Null

            # Source 1: files uploaded to the repo root (e.g. via the GitHub web UI).
            Get-ChildItem -Path . -File -Filter *.zip |
              Where-Object { $_.Name -notmatch 'blueprint' } |
              ForEach-Object {
                Write-Host "Using root upload: $($_.Name)"
                Copy-Item $_.FullName "_gamelibs/$($_.Name)" -Force
              }
            Get-ChildItem -Path . -File -Filter *.dll |
              ForEach-Object {
                Write-Host "Using root upload: $($_.Name)"
                Copy-Item $_.FullName "_gamelibs/$($_.Name)" -Force
              }

            # Source 2: 'game-libs' release assets (skip the blueprint dump and anything
            # already harvested from the repo root).
            $assets = @(& gh release view game-libs --json assets --jq '.[].name')
            $global:LASTEXITCODE = 0
            foreach ($asset in $assets) {
              if ($asset -match 'blueprint') {
                Write-Host "Skipping $asset (not needed for build)"
                continue
              }
              if (Test-Path "_gamelibs/$asset") {
                Write-Host "Skipping $asset (already harvested from repo)"
                continue
              }
              Write-Host "Downloading $asset"
              & gh release download game-libs --pattern $asset --dir _gamelibs --clobber
              $global:LASTEXITCODE = 0
            }

            # Expand any zips that were gathered.
            Get-ChildItem -Path _gamelibs -Recurse -Filter *.zip | ForEach-Object {
              Write-Host "Extracting $($_.Name)"
              Expand-Archive -Path $_.FullName -DestinationPath ($_.FullName + "_extracted") -Force
            }

            # Sort the DLLs into place regardless of how they were packaged.
            foreach ($dll in Get-ChildItem -Path _gamelibs -Recurse -Filter *.dll) {
              if ($umm -contains $dll.Name) {
                New-Item -ItemType Directory -Force -Path "Libs/UMM" | Out-Null
                Copy-Item $dll.FullName "Libs/UMM/$($dll.Name)" -Force
                Write-Host "Placed $($dll.Name) in Libs/UMM/"
              }
              elseif ($managed -contains $dll.Name) {
                Copy-Item $dll.FullName "Libs/$($dll.Name)" -Force
                Write-Host "Placed $($dll.Name) in Libs/"
              }
              else {
                Write-Host "Ignoring extra file: $($dll.Name)"
              }
            }

            Write-Host "=== DLLs available after sorting ==="
            Get-ChildItem -Recurse Libs -Filter *.dll | ForEach-Object { Write-Host "  $($_.FullName)" }
          }

          if (Test-AllLibs) {
            "ready=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "ready=false" >> $env:GITHUB_OUTPUT
            "## Build waiting for game libraries" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "Attach the 11 required DLLs to the [game-libs release](../../releases/tag/game-libs) (loose or in any zip), then re-run this workflow." >> $env:GITHUB_STEP_SUMMARY
            "See docs/GAME-FILES-NEEDED.md for the exact list." >> $env:GITHUB_STEP_SUMMARY
            Write-Host "::notice::Build skipped - waiting for game DLLs on the 'game-libs' release (see docs/GAME-FILES-NEEDED.md)."
          }
          exit 0

      - name: Build mod
        if: steps.libs.outputs.ready == 'true'
        shell: pwsh
        run: |
          # Pre-flight: verify the reference DLLs are actually present and look like DLLs.
          # (Surfaced as annotations so failures here are diagnosable without log access.)
          foreach ($p in @(
              "Libs\Assembly-CSharp.dll", "Libs\Assembly-CSharp-firstpass.dll",
              "Libs\Newtonsoft.Json.dll", "Libs\Owlcat.Runtime.Core.dll",
              "Libs\Owlcat.Runtime.UI.dll", "Libs\Owlcat.Runtime.Validation.dll",
              "Libs\Owlcat.Runtime.Visual.dll", "Libs\UnityEngine.dll",
              "Libs\UnityEngine.CoreModule.dll",
              "Libs\UMM\UnityModManager.dll", "Libs\UMM\0Harmony.dll")) {
            if (Test-Path $p) {
              $item = Get-Item $p
              $magic = [System.IO.File]::ReadAllBytes($item.FullName)[0..1] -join ""
              Write-Host "::notice::$p exists ($($item.Length) bytes, magic=$magic)"
            }
            else {
              Write-Host "::error::$p is MISSING at build time"
            }
          }

          # MSBuild (not `dotnet build`): verbose so reference-resolution failures are captured.
          $log = "build_output.txt"
          & msbuild src/MissionWOTR/MissionWOTR.csproj -restore -p:Configuration=Release -v:detailed -nologo 2>&1 |
            ForEach-Object { "$_" } |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            # Reference resolution reasons (why a HintPath may have been rejected).
            $rar = Select-String -Path $log -Pattern "Could not resolve this reference|Could not locate the assembly|expected to contain an assembly manifest" |
              Select-Object -First 8
            foreach ($r in $rar) { Write-Host "::error::RAR: $($r.Line.Trim())" }
            # Compile errors, deduplicated.
            $errs = Select-String -Path $log -Pattern ": error " | ForEach-Object { $_.Line.Trim() } |
              Select-Object -Unique -First 10
            foreach ($e in $errs) { Write-Host "::error::$e" }
            exit 1
          }
          $zip = "src/MissionWOTR/bin/Release/net472/MissionWOTR.zip"
          if (-not (Test-Path $zip)) {
            Write-Host "::error::MSBuild reported success but $zip was not produced."
            Get-ChildItem -Recurse src/MissionWOTR/bin -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "missing release zip"
          }
          Write-Host "Built $zip successfully."

      - name: Upload build log
        if: failure() && steps.libs.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: ignore

      - name: Upload built mod
        if: steps.libs.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MissionWOTR
          path: src/MissionWOTR/bin/Release/net472/MissionWOTR.zip
          if-no-files-found: error

      - name: Write waiting notice
        if: steps.libs.outputs.ready != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _status | Out-Null
          Set-Content _status/README.txt @(
            "Build skipped: the game's reference DLLs were not found.",
            "",
            "To enable builds: attach the 11 DLLs (loose or in any zip) to the 'game-libs' GitHub release,",
            "then re-run the Build workflow. See docs/GAME-FILES-NEEDED.md for the exact list."
          )

      - name: Upload waiting notice
        if: steps.libs.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waiting-for-game-libs
          path: _status/README.txt
